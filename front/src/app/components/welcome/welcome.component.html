@if (!showLoader()) {
  @if (user$ | async; as user) {
    <div class="flex-center">
      <mat-icon>info</mat-icon>Welcome, {{ user.login }}
    </div>
  } @else {
    <div class="flex-center">
      <mat-icon>warning</mat-icon>You're not logged in
    </div>
  }
} @else {
  <div class="flex-center">
    <mat-spinner></mat-spinner>
  </div>
}
