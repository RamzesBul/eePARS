@if (!showLoader()) {
  <div class="flex-center auth-form">
    <mat-form-field>
      <mat-label>User login</mat-label>
      <input matInput [(ngModel)]="login">
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>Email</mat-label>
      <input matInput [(ngModel)]="email">
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <mat-label>User password</mat-label>
      <input type="password" matInput [(ngModel)]="password">
    </mat-form-field>
    <button mat-flat-button (click)="onRegisterClick()">
      Register
    </button>
  </div>
} @else {
  <div class="flex-center">
    <mat-spinner></mat-spinner>
  </div>
}
